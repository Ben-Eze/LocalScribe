<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="LocalScribe" />
  <title>LocalScribe Voice</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    button.muted-on { background: var(--danger); }
    textarea { background: var(--panel); flex: 1; min-height: 140px; }
    select { font: inherit; color: var(--fg); background: var(--bg); padding: 8px; border: 1px solid var(--border); border-radius: 8px; flex: 1; }
    /* Sound-wave icon: bar heights are driven by mic volume; hidden entirely while muted. */
    .wave { display: flex; align-items: center; gap: 4px; height: 40px; width: 52px; }
    .wave span { width: 6px; height: 4px; border-radius: 3px; background: var(--accent); transition: height 60ms linear; }
  </style>
</head>
<body>
  <nav class="steps">
    <a href="index.html">1 · Model</a>
    <a href="voice.html" class="current">2 · Voice</a>
    <a href="notes.html">3 · Notes</a>
  </nav>
  <div id="status" class="muted">Starting…</div>

  <div id="progress" class="hidden">
    <div class="bar"><div id="progressFill"></div></div>
  </div>

  <button id="start">Start listening</button>

  <div id="controls" class="row hidden">
    <button id="mute">Mute</button>
    <div id="wave" class="wave"><span></span><span></span><span></span><span></span><span></span></div>
    <button id="clear" class="secondary">Clear</button>
  </div>

  <textarea id="transcript" placeholder="Transcribed speech appears here…"></textarea>

  <h2>Speech output</h2>
  <div class="row">
    <select id="ttsEngine"></select>
    <select id="ttsVoice"></select>
  </div>
  <div id="kokoroSetup" class="hidden">
    <button id="kokoroDownload" class="secondary">Download Kokoro (~92 MB)</button>
    <div id="kokoroProgress" class="bar hidden" style="margin-top:8px"><div id="kokoroFill"></div></div>
  </div>
  <div class="row">
    <input id="ttsText" type="text" value="Sure, I've created a new note called shopping." />
    <button id="ttsSpeak">Speak</button>
  </div>
  <div id="ttsStatus" class="muted"></div>

  <script type="module">
    import { createSpeaker, ENGINES, ROBOT_VARIANTS, KOKORO_VOICES } from './tts.js';

    const $ = (id) => document.getElementById(id);
    const show = (el, visible) => el.classList.toggle('hidden', !visible);
    const setStatus = (text) => { $('status').textContent = text; };

    const TARGET_RATE = 16000;        // Whisper expects 16 kHz mono
    const SILENCE_TO_END_MS = 800;    // a pause this long ends a sentence
    const MIN_SPEECH_MS = 300;        // ignore clicks and bumps
    const MAX_SEGMENT_MS = 20000;     // force a cut during long monologues
    const PREROLL_MS = 300;           // keep a little audio from before speech was detected

    const worker = new Worker('voice-worker.js', { type: 'module' });
    let ready = false;
    let muted = false;
    let stream = null;
    let audioCtx = null;
    let analyser = null;

    // ---- Whisper model loading ----
    const fileProgress = new Map();
    worker.onmessage = ({ data }) => {
      if (data.type === 'progress') {
        fileProgress.set(data.file, data);
        const loaded = [...fileProgress.values()].reduce((s, p) => s + (p.loaded ?? 0), 0);
        const total = [...fileProgress.values()].reduce((s, p) => s + (p.total ?? 0), 0);
        show($('progress'), true);
        $('progressFill').style.width = `${total ? (loaded / total) * 100 : 0}%`;
        setStatus(`Downloading Whisper tiny.en… ${(loaded / 1e6).toFixed(0)} / ${(total / 1e6).toFixed(0)} MB`);
      } else if (data.type === 'ready') {
        ready = true;
        show($('progress'), false);
        setStatus(stream ? 'Listening.' : 'Whisper ready. Tap Start listening.');
        processQueue();
      } else if (data.type === 'result') {
        busy = false;
        const text = cleanTranscript(data.text);
        if (text) {
          const box = $('transcript');
          box.value += (box.value && !box.value.endsWith('\n') ? ' ' : '') + text;
          box.scrollTop = box.scrollHeight;
        }
        setStatus(`Transcribed ${data.seconds.toFixed(1)}s of audio in ${(data.ms / 1000).toFixed(1)}s.${muted ? ' Muted.' : ' Listening.'}`);
        processQueue();
      } else if (data.type === 'error') {
        busy = false;
        setStatus(`Whisper error: ${data.message}`);
      }
    };
    worker.postMessage({ type: 'load' });

    // Whisper invents text like "[BLANK_AUDIO]" or "(wind blowing)" for non-speech; drop those.
    function cleanTranscript(text) {
      return text.replace(/\[[^\]]*\]|\([^)]*\)/g, '').replace(/\s+/g, ' ').trim();
    }

    // ---- Transcription queue: one segment at a time ----
    const queue = [];
    let busy = false;
    function processQueue() {
      if (!ready || busy || queue.length === 0) return;
      busy = true;
      setStatus('Transcribing…');
      const audio = queue.shift();
      worker.postMessage({ type: 'transcribe', audio }, [audio.buffer]);
    }

    function resampleTo16k(chunks, fromRate) {
      const length = chunks.reduce((n, c) => n + c.length, 0);
      const input = new Float32Array(length);
      let offset = 0;
      for (const c of chunks) { input.set(c, offset); offset += c.length; }

      const ratio = fromRate / TARGET_RATE;
      const output = new Float32Array(Math.floor(length / ratio));
      for (let i = 0; i < output.length; i++) {
        const pos = i * ratio;
        const i0 = Math.floor(pos);
        const i1 = Math.min(i0 + 1, length - 1);
        output[i] = input[i0] + (input[i1] - input[i0]) * (pos - i0);
      }
      return output;
    }

    // ---- Voice activity detection: energy above an adaptive noise floor ----
    let noiseFloor = 0.005;
    let segment = null;          // chunks of the sentence currently being spoken
    let preroll = [];            // recent chunks kept in case speech starts
    let speechMs = 0;
    let silenceMs = 0;

    function rms(samples) {
      let sum = 0;
      for (let i = 0; i < samples.length; i++) sum += samples[i] * samples[i];
      return Math.sqrt(sum / samples.length);
    }

    function onAudioChunk(samples, rate) {
      // Ignore the mic while the phone itself is talking, so the agent doesn't transcribe its own voice.
      if (muted || ttsSpeaking) return;
      const chunkMs = (samples.length / rate) * 1000;
      const level = rms(samples);
      const isSpeech = level > Math.max(0.01, noiseFloor * 3);
      // Track background noise only when nobody is talking, so the threshold adapts to the room.
      if (!isSpeech) noiseFloor = noiseFloor * 0.95 + level * 0.05;

      if (!segment) {
        preroll.push(samples);
        while (preroll.length * chunkMs > PREROLL_MS) preroll.shift();
        if (isSpeech) {
          segment = [...preroll];
          preroll = [];
          speechMs = chunkMs;
          silenceMs = 0;
        }
        return;
      }

      segment.push(samples);
      if (isSpeech) { speechMs += chunkMs; silenceMs = 0; } else { silenceMs += chunkMs; }
      const segmentMs = segment.length * chunkMs;

      if (silenceMs >= SILENCE_TO_END_MS || segmentMs >= MAX_SEGMENT_MS) {
        if (speechMs >= MIN_SPEECH_MS) {
          queue.push(resampleTo16k(segment, rate));
          processQueue();
        }
        segment = null;
      }
    }

    // ---- Microphone ----
    async function start() {
      $('start').disabled = true;
      // Recording and playback in the same session (otherwise iOS may route replies to the earpiece or mute them).
      if (navigator.audioSession) navigator.audioSession.type = 'play-and-record';
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        });
      } catch (e) {
        setStatus(`Microphone unavailable: ${e?.message ?? e}`);
        $('start').disabled = false;
        return;
      }

      audioCtx = new AudioContext();
      const source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      source.connect(analyser);

      // ScriptProcessorNode is deprecated but is the simplest capture path that works in every Safari version.
      const processor = audioCtx.createScriptProcessor(4096, 1, 1);
      processor.onaudioprocess = (e) => onAudioChunk(new Float32Array(e.inputBuffer.getChannelData(0)), audioCtx.sampleRate);
      source.connect(processor);
      processor.connect(audioCtx.destination); // outputs silence; needed for the node to run

      show($('start'), false);
      show($('controls'), true);
      setStatus(ready ? 'Listening.' : 'Microphone on. Waiting for Whisper to finish loading…');
      animateWave();
    }

    // iOS suspends audio when the app is backgrounded; pick it back up on return.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && audioCtx && audioCtx.state !== 'running') audioCtx.resume();
    });

    function setMuted(value) {
      muted = value;
      stream?.getAudioTracks().forEach((t) => { t.enabled = !muted; });
      segment = null;
      preroll = [];
      $('mute').textContent = muted ? 'Unmute' : 'Mute';
      $('mute').classList.toggle('muted-on', muted);
      $('wave').style.visibility = muted ? 'hidden' : 'visible';
      if (!busy) setStatus(muted ? 'Muted.' : 'Listening.');
    }

    // ---- Sound-wave icon ----
    const bars = [...document.querySelectorAll('#wave span')];
    const BAR_SHAPE = [0.5, 0.8, 1, 0.8, 0.5]; // middle bars taller
    let smoothed = 0;
    function animateWave() {
      const samples = new Float32Array(analyser.fftSize);
      analyser.getFloatTimeDomainData(samples);
      // Map loudness to 0..1 on a rough log scale so quiet speech still visibly moves the bars.
      const level = muted ? 0 : Math.min(1, Math.max(0, (20 * Math.log10(rms(samples) + 1e-6) + 55) / 40));
      smoothed = smoothed * 0.6 + level * 0.4;
      bars.forEach((bar, i) => {
        const jitter = 0.85 + Math.random() * 0.3;
        bar.style.height = `${4 + smoothed * 36 * BAR_SHAPE[i] * jitter}px`;
      });
      requestAnimationFrame(animateWave);
    }

    // ---- Speech output ----
    let ttsSpeaking = false;
    const speaker = createSpeaker({
      onSpeakingChange: (on) => {
        ttsSpeaking = on;
        if (on) { segment = null; preroll = []; }
      },
    });

    for (const [id, label] of Object.entries(ENGINES)) $('ttsEngine').append(new Option(label, id, false, id === speaker.settings.engine));

    function renderTtsOptions() {
      const engine = speaker.settings.engine;
      const voices = engine === 'robot' ? Object.fromEntries(ROBOT_VARIANTS.map((v) => [v, `voice: ${v}`]))
        : engine === 'kokoro' ? KOKORO_VOICES : null;
      const selected = engine === 'robot' ? speaker.settings.robotVariant : speaker.settings.kokoroVoice;
      $('ttsVoice').innerHTML = '';
      show($('ttsVoice'), !!voices);
      for (const [id, label] of Object.entries(voices ?? {})) $('ttsVoice').append(new Option(label, id, false, id === selected));
      show($('kokoroSetup'), engine === 'kokoro' && !kokoroLoaded);
      $('ttsSpeak').disabled = engine === 'kokoro' && !kokoroLoaded;
    }

    let kokoroLoaded = false;
    function loadKokoro() {
      $('kokoroDownload').disabled = true;
      show($('kokoroProgress'), true);
      const files = new Map();
      $('ttsStatus').textContent = 'Loading Kokoro…';
      speaker.loadKokoro((p) => {
        files.set(p.file, p);
        const loaded = [...files.values()].reduce((s, f) => s + (f.loaded ?? 0), 0);
        const total = [...files.values()].reduce((s, f) => s + (f.total ?? 0), 0);
        $('kokoroFill').style.width = `${total ? (loaded / total) * 100 : 0}%`;
        $('ttsStatus').textContent = `Downloading Kokoro… ${(loaded / 1e6).toFixed(0)} / ${(total / 1e6).toFixed(0)} MB`;
      }).then(() => {
        kokoroLoaded = true;
        $('ttsStatus').textContent = 'Kokoro ready.';
        renderTtsOptions();
      }).catch((e) => {
        $('ttsStatus').textContent = `Kokoro failed: ${e.message}`;
        $('kokoroDownload').disabled = false;
      });
    }

    $('ttsEngine').onchange = () => {
      speaker.settings.engine = $('ttsEngine').value;
      if (speaker.settings.engine === 'kokoro' && speaker.settings.kokoroDownloaded) loadKokoro();
      renderTtsOptions();
    };
    $('ttsVoice').onchange = () => {
      if (speaker.settings.engine === 'robot') speaker.settings.robotVariant = $('ttsVoice').value;
      else speaker.settings.kokoroVoice = $('ttsVoice').value;
    };
    $('kokoroDownload').onclick = loadKokoro;
    $('ttsSpeak').onclick = async () => {
      speaker.unlock();
      $('ttsSpeak').disabled = true;
      $('ttsStatus').textContent = 'Generating…';
      try {
        const r = await speaker.speak($('ttsText').value);
        $('ttsStatus').textContent = r.engine === 'system'
          ? 'Spoken with the phone voice.'
          : `Generated ${r.audioSeconds.toFixed(1)}s of speech in ${(r.generateMs / 1000).toFixed(2)}s (${r.engine}).`;
      } catch (e) {
        $('ttsStatus').textContent = `Speech failed: ${e?.message ?? e}`;
      }
      $('ttsSpeak').disabled = false;
    };

    if (speaker.settings.engine === 'kokoro' && speaker.settings.kokoroDownloaded) loadKokoro();
    renderTtsOptions();

    $('start').onclick = start;
    $('mute').onclick = () => setMuted(!muted);
    $('clear').onclick = () => { $('transcript').value = ''; };
  </script>
</body>
</html>
