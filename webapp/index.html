<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="LocalScribe" />
  <title>LocalScribe</title>
  <link rel="stylesheet" href="style.css?v=__V__" />
  <script type="module" src="version-check.js?v=__V__"></script>
  <style>
    .model { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; }
    .model label { flex: 1; }
    .model button { padding: 6px 10px; font-size: 14px; }
    #setup { display: flex; flex-direction: column; gap: 12px; }
    #reply { flex: 1; min-height: 160px; background: var(--panel); border-radius: 8px; padding: 12px; white-space: pre-wrap; overflow-y: auto; }
  </style>
</head>
<body>
  <nav class="steps">
    <a href="index.html" class="current">1 · Model</a>
    <a href="voice.html">2 · Voice</a>
    <a href="notes.html">3 · Practice</a>
    <a href="agent.html">4 · Agent</a>
    <a href="library.html">5 · Notes</a>
  </nav>
  <div id="status" class="muted">Starting…</div>

  <section id="setup" class="hidden">
    <div id="models" style="display:flex;flex-direction:column;gap:8px"></div>
    <div id="storage" class="muted"></div>
    <label><input type="checkbox" id="gpu" /> Use GPU (WebGPU) — faster, but needs more memory</label>
    <button id="load">Download &amp; load model</button>
    <div id="progress" class="hidden">
      <div class="bar"><div id="progressFill"></div></div>
      <div id="progressText" class="muted"></div>
    </div>
  </section>

  <section id="chat" class="hidden" style="display:flex;flex-direction:column;gap:12px;flex:1">
    <h2>Test it</h2>
    <div id="reply"></div>
    <textarea id="input" placeholder="Ask something…"></textarea>
    <div class="row">
      <button id="send">Send</button>
      <button id="stop" class="hidden">Stop</button>
      <button id="unload" class="secondary">Unload</button>
      <button id="delete" class="danger">Delete</button>
    </div>
  </section>

  <script type="module">
    import { Wllama } from 'https://cdn.jsdelivr.net/npm/@wllama/wllama@3.8.1/esm/index.js';
    import { MODELS, WLLAMA, urlOf } from './models.js?v=__V__';

    const $ = (id) => document.getElementById(id);
    const show = (el, visible) => el.classList.toggle('hidden', !visible);
    const setStatus = (text) => { $('status').textContent = text; };
    // Remember the last choice so the next launch loads it straight away. Storage can be unavailable; that's fine.
    const prefs = {
      get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
      set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
    };

    const wllama = new Wllama({ default: `${WLLAMA}/wasm/wllama.wasm` });
    let current = null;
    let abortController = null;

    async function isCached(m) {
      return (await wllama.cacheManager.open(urlOf(m)).catch(() => null)) !== null;
    }

    const selectedModel = () => MODELS.find((m) => m.id === document.querySelector('input[name=model]:checked')?.value) ?? MODELS[0];

    async function renderModels() {
      const selectedId = prefs.get('model') ?? MODELS[0].id;
      let usedBytes = 0;
      $('models').innerHTML = '';
      for (const m of MODELS) {
        const cached = await isCached(m);
        if (cached) usedBytes += await wllama.cacheManager.getSize(await wllama.cacheManager.getNameFromURL(urlOf(m)));

        const row = document.createElement('div');
        row.className = 'model';
        row.innerHTML = `<label><input type="radio" name="model" value="${m.id}" ${m.id === selectedId ? 'checked' : ''} />
          <span>${m.label}${cached ? '<br><span class="muted">On device</span>' : ''}</span></label>`;
        if (cached) {
          const del = document.createElement('button');
          del.className = 'danger';
          del.textContent = 'Delete';
          del.onclick = async () => {
            await wllama.cacheManager.delete(urlOf(m));
            await renderModels();
          };
          row.append(del);
        }
        $('models').append(row);
      }
      $('storage').textContent = `Models on device: ${(usedBytes / 1e6).toFixed(0)} MB`;
      $('gpu').checked = prefs.get('gpu') === '1';
    }

    const setSetupEnabled = (enabled) => {
      document.querySelectorAll('#setup input, #setup button').forEach((el) => { el.disabled = !enabled; });
    };

    async function loadModel() {
      current = selectedModel();
      const useGpu = $('gpu').checked;
      prefs.set('model', current.id);
      prefs.set('gpu', useGpu ? '1' : '0');
      // Cleared once loading succeeds; if Safari kills the tab mid-load, the next launch won't auto-load into the same crash.
      prefs.set('loading', '1');

      setSetupEnabled(false);
      show($('progress'), true);
      setStatus('Loading model (downloads on first run)…');
      // Ask Safari not to evict the cached model under storage pressure.
      await navigator.storage?.persist?.().catch(() => {});

      const startedAt = performance.now();
      try {
        await wllama.loadModelFromHF({ repo: current.repo, file: current.file }, {
          n_ctx: 1024,
          n_gpu_layers: useGpu ? 99 : 0,
          progressCallback: ({ loaded, total }) => {
            const pct = total > 0 ? (loaded / total) * 100 : 0;
            $('progressFill').style.width = `${pct}%`;
            $('progressText').textContent = `${(loaded / 1e6).toFixed(0)} / ${(total / 1e6).toFixed(0)} MB`;
            if (loaded === total) setStatus('Downloaded. Loading into memory…');
          },
        });
      } catch (e) {
        prefs.set('loading', '0');
        setStatus(`Failed to load model: ${e?.message ?? e}`);
        setSetupEnabled(true);
        return;
      }
      prefs.set('loading', '0');

      const secs = ((performance.now() - startedAt) / 1000).toFixed(1);
      setStatus(`${current.label.split(' · ')[0]} loaded in ${secs}s · ${useGpu && wllama.isSupportWebGPU() ? 'GPU' : 'CPU'}`);
      // The model list stays visible (disabled while loaded) with the test chat below it.
      show($('progress'), false);
      show($('chat'), true);
    }

    async function send() {
      const text = $('input').value.trim();
      if (!text) return;

      $('reply').textContent = '';
      show($('send'), false);
      show($('stop'), true);
      $('delete').disabled = $('unload').disabled = true;
      abortController = new AbortController();

      let timings = null;
      try {
        // No history: every message is a fresh single-turn prompt.
        const stream = await wllama.createChatCompletion({
          messages: [{ role: 'user', content: text + (current.promptSuffix ?? '') }],
          max_tokens: 512,
          temperature: 0.7,
          stream: true,
          abortSignal: abortController.signal,
        });
        for await (const chunk of stream) {
          $('reply').textContent += chunk.choices[0]?.delta?.content ?? '';
          if (chunk.timings) timings = chunk.timings;
        }
        if (timings) setStatus(`${timings.predicted_per_second.toFixed(1)} tokens/s`);
      } catch (e) {
        if (e?.name !== 'AbortError') setStatus(`Generation failed: ${e?.message ?? e}`);
      } finally {
        abortController = null;
        show($('send'), true);
        show($('stop'), false);
        $('delete').disabled = $('unload').disabled = false;
      }
    }

    // Reloading the page is the most reliable way to give all of the model's memory back to iOS.
    // The flag stops the reloaded page from immediately auto-loading the model again.
    function unloadModel() {
      try { sessionStorage.setItem('skipAutoload', '1'); } catch {}
      location.reload();
    }

    async function deleteModel() {
      await wllama.exit();
      await wllama.cacheManager.delete(urlOf(current));
      unloadModel();
    }

    $('load').onclick = loadModel;
    $('send').onclick = send;
    $('stop').onclick = () => abortController?.abort();
    $('unload').onclick = unloadModel;
    $('delete').onclick = deleteModel;

    await renderModels();
    show($('setup'), true);
    const crashedLastTime = prefs.get('loading') === '1';
    prefs.set('loading', '0');
    let skipAutoload = false;
    try { skipAutoload = sessionStorage.getItem('skipAutoload') === '1'; sessionStorage.removeItem('skipAutoload'); } catch {}
    if (crashedLastTime) {
      setStatus('The last load did not finish (likely out of memory). Try a smaller model or turn GPU off.');
    } else if (skipAutoload) {
      setStatus('Model unloaded. Pick a model to load.');
    } else if (await isCached(selectedModel())) {
      setStatus('Model found on device, loading…');
      loadModel();
    } else {
      setStatus('Pick a model and download it.');
    }
  </script>
</body>
</html>
